<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- TITLE --></title>
<script>MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--muted:#6b6b70;--line:#e5e5ea;--accent:#2f5fd0;--chip:#eef2ff;--code:#f5f5f7}
@media (prefers-color-scheme:dark){:root{--bg:#111114;--fg:#ececf1;--muted:#9a9aa3;--line:#2a2a30;--accent:#8fb0ff;--chip:#1e2540;--code:#1b1b20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.75 -apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.45rem;line-height:1.35;margin:.4em 0}
h2{font-size:1.2rem;margin:2.2em 0 .6em;padding-top:1em;border-top:1px solid var(--line)}
h3{font-size:1.05rem;margin:1.6em 0 .4em}
p{margin:.6em 0}
a{color:var(--accent)}
.meta{color:var(--muted);font-size:.92rem}
.chips span{display:inline-block;background:var(--chip);color:var(--accent);border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0;font-size:.85rem}
.nav{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
code,pre{background:var(--code);border-radius:6px;font-size:.9em}
code{padding:1px 5px}
pre{padding:12px;overflow-x:auto}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
summary{cursor:pointer;color:var(--accent);font-weight:600}
.callout{border-left:4px solid var(--accent);background:var(--chip);padding:10px 14px;border-radius:0 8px 8px 0;margin:1em 0}
.warn{border-left-color:#d08a2f;background:#fff6e8;color:#5a3d0c}
@media (prefers-color-scheme:dark){.warn{background:#3a2a10;color:#f3d7a8}}
ol.q li{margin:.9em 0}
</style>
</head>
<body>
<main>
<div class="nav"><a href="../index.html">← 목록</a><span class="meta"><!-- DATE --></span></div>
<!-- CONTENT -->
</main>
</body>
</html>
